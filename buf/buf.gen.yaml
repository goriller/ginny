version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/goriller/ginny/v2/gen
plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen
    opt:
      - paths=source_relative
  - remote: buf.build/connectrpc/go
    out: gen
    opt:
      - paths=source_relative
  - remote: buf.build/bufbuild/validate-go  # optional: for proto validation
    out: gen
    opt:
      - paths=source_relative
